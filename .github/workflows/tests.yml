name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ubuntu-python:
    name: ${{ matrix.os }} system Python
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, ubuntu-24.04]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      # Use Ubuntu's interpreter deliberately: a newer patch release can hide
      # differences in the command-line parser shipped with the distribution.
      - name: Run tests with the distribution interpreter
        run: |
          /usr/bin/python3 --version
          /usr/bin/python3 -m unittest discover -s tests -v

  current-python:
    name: Current Python
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'
      - name: Run tests
        run: |
          python --version
          python -m unittest discover -s tests -v
